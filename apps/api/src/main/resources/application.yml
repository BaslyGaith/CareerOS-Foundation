spring:
  application:
    name: career-os-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:careerosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

careeros:
  upload-dir: ${user.home}/careeros-uploads

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:super_secret_key_for_development_purposes_only_replace_in_prod_with_something_long_enough}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
